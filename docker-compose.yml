services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geo-points-db
    environment:
      POSTGRES_DB: geodb
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geodb"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
    container_name: geo-points-api
    environment:
      DATABASE_URL: postgres://geo:geo@db:5432/geodb
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    container_name: geo-points-web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
      VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
